name: generate-snake

on:
  schedule:
    - cron: "30 1 * * *"  # ทุกวัน 01:30 UTC
  workflow_dispatch:
  push:
    branches: [main]

# push รัว ๆ ให้ยกเลิกรอบเก่า ไม่ต่อคิวซ้ำ
concurrency:
  group: generate-snake
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate snake animation
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#F7B32B
            dist/snake-light.svg?palette=github-light&color_snake=#F7B32B

      - name: Publish to snake-output branch
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4
        with:
          branch: snake-output
          folder: dist
          clean: true

      - name: Notify on failure
        if: failure()
        run: |
          curl -X POST -H "Authorization: token ${{ github.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/issues \
            -d '{"title":"⚠️ Snake workflow failed","body":"Workflow \`generate-snake\` ล้มเหลว (รันที่ ${{ github.run_attempt }})\nดูรายละเอียด: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
