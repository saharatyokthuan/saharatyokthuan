name: generate-snake

on:
  schedule:
    - cron: "30 1 * * *"  # ทุกวัน 01:30 UTC
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snake@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          gif_out_path: dist/snake.gif
          svg_out_path: dist/snake.svg

      - name: Publish to snake-output branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: snake-output
          folder: dist
          clean: true
