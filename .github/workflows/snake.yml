name: generate-snake

on:
  schedule:
    - cron: "30 1 * * *"  # ทุกวัน 01:30 UTC
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            snake-dark.svg?palette=github-dark&color_snake=#F7B32B
            snake-light.svg?palette=github-light&color_snake=#F7B32B

      - name: Publish to snake-output branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: snake-output
          folder: dist
          clean: true
